name = "uplift"
main = "src/index.ts"
compatibility_date = "2025-02-01"
compatibility_flags = ["nodejs_compat"]

workers_dev = true

# Secrets are NOT set here. Use `wrangler secret put <NAME>` so they are
# stored encrypted. See .dev.vars.example for the full list.
[vars]
NODE_ENV = "production"
ALLOWED_ORIGINS = "https://uplift.llakterian.workers.dev,https://uplift.news,https://www.uplift.news,http://localhost:5173,http://127.0.0.1:5173"

[assets]
directory = "../dist"
binding = "ASSETS"
# Run the Worker for every request so the security headers (CSP, HSTS, ...)
# are applied to the HTML shell as well as to API responses. With the default
# (assets served first) the HTML would be returned without any CSP.
run_worker_first = true
not_found_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "uplift-db"
database_id = "c4d2c8b4-20ec-44d7-88c4-966e446611ee"

[[kv_namespaces]]
binding = "UPLIFT_CACHE"
id = "f880fe048f9f4dc7b2adb54a1246e8a4"

[triggers]
crons = ["*/15 * * * *"] # Every 15 min for sync
