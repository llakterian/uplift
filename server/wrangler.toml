name = "uplift-api"
main = "src/index.ts"
compatibility_date = "2025-02-01"
compatibility_flags = ["nodejs_compat"]

workers_dev = true

routes = [
  { pattern = "uplift.llakterian.workers.dev", custom_domain = true }
]

[vars]
NODE_ENV = "development"
ALLOWED_ORIGINS = "http://localhost:5173,http://localhost:3000,https://uplift.news"

# Local dev KV (auto-created by wrangler dev)
[[kv_namespaces]]
binding = "UPLIFT_CACHE"
id = "local"
preview_id = "local"

# For production, uncomment and replace with real namespace:
# [[kv_namespaces]]
# binding = "UPLIFT_CACHE"
# id = "your-production-namespace-id"
