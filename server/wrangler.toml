name = "uplift"
main = "src/index.ts"
compatibility_date = "2025-02-01"
compatibility_flags = ["nodejs_compat"]

workers_dev = true

[vars]
NODE_ENV = "production"
ALLOWED_ORIGINS = "https://uplift.llakterian.workers.dev,https://uplift.news,https://www.uplift.news,http://localhost:5173"

[assets]
directory = "../dist"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "uplift-db"
database_id = "c4d2c8b4-20ec-44d7-88c4-966e446611ee"
