name = "uplift-api"
main = "src/index.ts"
compatibility_date = "2025-02-01"
compatibility_flags = ["nodejs_compat"]

workers_dev = true

routes = [
  { pattern = "uplift.llakterian.workers.dev", custom_domain = true }
]

[vars]
NODE_ENV = "production"
ALLOWED_ORIGINS = "https://uplift.news,https://www.uplift.news,http://localhost:5173"

# For local development only - production has no KV caching
# Run: npx wrangler kv:namespace create "UPLIFT_CACHE" to create one
