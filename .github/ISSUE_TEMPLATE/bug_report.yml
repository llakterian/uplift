name: Bug report
description: Something in Uplift is not working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please do not include
        secrets, API keys, or personal data in your report.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear description of the behaviour.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected to happen
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the feed
        2. Scroll down
        3. ...
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, and whether you are running locally or on the deployed Worker.
    validations:
      required: true
